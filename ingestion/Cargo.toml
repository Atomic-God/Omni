[package]
name = "ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
core-vsa = { path = "../core-vsa" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.3"
whatlang = "0.16"
regex = "1.9"
once_cell = "1.18"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
html2text = "0.2"
hex = "0.4"
xml-rs = "0.8"
csv = "1.3"
image = "0.24"
id3 = "1.6"
mp4 = "0.14"
calamine = "0.24"
lofty = "0.15"
lopdf = "0.31" # Pure Rust PDF parsing
ignore = "0.4" # For .gitignore support in recursive walks
rayon = "1.8" # Parallel ingestion
unicode-normalization = "0.1"
