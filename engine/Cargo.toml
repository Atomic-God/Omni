[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
seahash = "4.1"
bincode = "1.3"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
rand = "0.8"
chrono = "0.4"
# Crate dependencies
core-vsa = { path = "../core-vsa" }
cognition = { path = "../cognition" }
memory = { path = "../memory" }
ingestion = { path = "../ingestion" }
runtime = { path = "../runtime" }
hte = { path = "../hte" }
perception = { path = "../perception" }
learning = { path = "../learning" }

[dev-dependencies]
image = "0.24"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "omni_bench"
harness = false

[[bench]]
name = "stress_test"
harness = false
