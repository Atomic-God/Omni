[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["fabrication"]
fabrication = []

[dependencies]
cognition = { path = "../cognition" }
memory = { path = "../memory" }
hte = { path = "../hte" }
perception = { path = "../perception" }
core-vsa = { path = "../core-vsa" }
learning = { path = "../learning" }
ingestion = { path = "../ingestion" }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "omni_bench"
harness = false
